apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-qwen36-sft-register-574bd7b3-v3
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: qwen36-sft-register-574bd7b3-v3
    cyber-post-train.fleet.ai/model: qwen36
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: training-lq
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: qwen36-sft-register-574bd7b3-v3
        cyber-post-train.fleet.ai/model: qwen36
    spec:
      restartPolicy: Never
      nodeSelector: {workload: fleetai-training-ng-cpu}
      tolerations:
        - {key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}
      containers:
        - name: register
          image: 661864827319.dkr.ecr.us-east-1.amazonaws.com/fleet/skyrl-train:q36-torchgdn-6db8d0c9@sha256:ba288751cd227c5be146d28f4a03237545d87d2cbd4c48464945b17fde566ff4
          command: ["python", "-m", "training.register_post_sft", "--receipt", "/bundle/serving-registration-receipt.json"]
          env:
            - {name: PYTHONPATH, value: /bundle}
            - name: FLEET_API_KEY
              valueFrom: {secretKeyRef: {name: fleet-api, key: FLEET_API_KEY}}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: bundle, mountPath: /bundle, readOnly: true}
      volumes:
        - name: bundle
          configMap:
            name: chris-cyber-qwen36-sft-register-574bd7b3-v3
            items:
              - {key: training__init__.py, path: training/__init__.py}
              - {key: training_io.py, path: training/io.py}
              - {key: training_register_post_sft.py, path: training/register_post_sft.py}
              - {key: serving-registration-receipt.json, path: serving-registration-receipt.json}
