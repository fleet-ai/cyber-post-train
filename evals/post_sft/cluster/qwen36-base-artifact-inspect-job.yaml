apiVersion: v1
kind: ServiceAccount
metadata:
  name: chris-cyber-qwen36-base-artifact-observer-v4
  namespace: inference
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chris-cyber-qwen36-base-artifact-observer-v4
  namespace: inference
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [chris-cyber-qwen36-base-artifact-inspect-6a9e13bd-v4]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    resourceNames: [chris-cyber-qwen36-base-artifact-inspect-6a9e13bd-v4]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chris-cyber-qwen36-base-artifact-observer-v4
  namespace: inference
subjects:
  - kind: ServiceAccount
    name: chris-cyber-qwen36-base-artifact-observer-v4
    namespace: inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chris-cyber-qwen36-base-artifact-observer-v4
---
apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-qwen36-base-artifact-inspect-6a9e13bd-v4
  namespace: inference
  labels:
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: qwen36-base-artifact-inspect-6a9e13bd-v4
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: qwen36-base-artifact-inspect-6a9e13bd-v4
    spec:
      restartPolicy: Never
      serviceAccountName: chris-cyber-qwen36-base-artifact-observer-v4
      imagePullSecrets:
        - name: ecr-pull
      nodeSelector: {workload: fleetai-training-ng-cpu}
      tolerations:
        - {key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}
      containers:
        - name: inspect
          image: 661864827319.dkr.ecr.us-east-1.amazonaws.com/fleet/skyrl-train:q36-torchgdn-6db8d0c9@sha256:ba288751cd227c5be146d28f4a03237545d87d2cbd4c48464945b17fde566ff4
          command: ["python3", "-m", "evals.webexploitbench.post_sft_evidence"]
          args:
            - inspect-base-artifact
            - --base-root
            - /models/qwen3.6-27b/6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
            - --plan
            - /bundle/post-sft-plan.json
            - --output
            - "-"
          env:
            - {name: PYTHONPATH, value: /bundle}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: JOB_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
          resources:
            requests: {cpu: "4", memory: 16Gi}
            limits: {cpu: "8", memory: 32Gi}
          volumeMounts:
            - {name: bundle, mountPath: /bundle, readOnly: true}
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: bundle
          configMap:
            name: chris-cyber-qwen36-base-artifact-inspect-6a9e13bd-v4
            items:
              - {key: evals__init__.py, path: evals/__init__.py}
              - {key: evals_webexploitbench__init__.py, path: evals/webexploitbench/__init__.py}
              - {key: post_sft_evidence.py, path: evals/webexploitbench/post_sft_evidence.py}
              - {key: training__init__.py, path: training/__init__.py}
              - {key: training_io.py, path: training/io.py}
              - {key: training_post_sft_artifacts.py, path: training/post_sft_artifacts.py}
              - {key: post-sft-plan.json, path: post-sft-plan.json}
        - name: models
          persistentVolumeClaim: {claimName: hf-cache-shared, readOnly: true}
