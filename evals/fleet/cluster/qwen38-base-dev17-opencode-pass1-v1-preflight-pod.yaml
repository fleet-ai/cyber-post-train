apiVersion: v1
kind: Pod
metadata:
  name: chris-q38-base-dev17-preflight-v1
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/postgres-client: "true"
spec:
  restartPolicy: Never
  nodeSelector: {kubernetes.io/arch: amd64, workload: fleetai-training-ng-cpu}
  tolerations:
    - {key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}
  containers:
    - name: preflight
      image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
      command:
        - uv
        - run
        - --no-project
        - --with
        - psycopg[binary]==3.3.5
        - python
        - -c
        - |
          import os
          import psycopg

          assert not os.path.exists("/mnt/sfs/jobs/chris-q38-fleet-dev17-base-p1-v1")
          connection = psycopg.connect(os.environ["ROLLOUT_DATABASE_URL"], connect_timeout=30)
          exists = connection.execute(
              "SELECT EXISTS(SELECT 1 FROM pg_database WHERE datname = %s)",
              ("q38_base_dev17_p1_v1",),
          ).fetchone()[0]
          connection.close()
          assert not exists
          print("output_and_database_absent")
      env:
        - name: ROLLOUT_DATABASE_URL
          valueFrom:
            secretKeyRef: {name: chris-cyber-rollout-postgres-v1, key: ROLLOUT_DATABASE_URL}
      resources:
        requests: {cpu: 100m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
      volumeMounts:
        - {name: sfs, mountPath: /mnt/sfs, readOnly: true}
  volumes:
    - name: sfs
      persistentVolumeClaim: {claimName: sfs-shared}
