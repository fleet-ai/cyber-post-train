apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-hosted-q38-c4-addon-v2
  namespace: fleet-train-jobs
  annotations:
    cyber-post-train.fleet.ai/preview-only: "true"
    cyber-post-train.fleet.ai/launch-authorized: "false"
  labels:
    cyber-post-train.fleet.ai/experiment: hosted-q38-c4-addon-v2
    cyber-post-train.fleet.ai/owner: chris
    kueue.x-k8s.io/queue-name: training-lq
spec:
  activeDeadlineSeconds: 1200
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/experiment: hosted-q38-c4-addon-v2
        cyber-post-train.fleet.ai/owner: chris
    spec:
      restartPolicy: Never
      preemptionPolicy: Never
      priorityClassName: fleet-serve-low
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      containers:
        - name: qualifier
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command: ["bash", "/bootstrap/run.sh"]
          env:
            - name: FLEET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chris-cyber-opencode-evals-v2
                  key: FLEET_API_KEY
            - name: EXPECTED_SECRET_UID
              value: e0febd8e-94a2-46b0-a0bf-dd6b3154187b
            - name: JOB_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: PACKAGE_COMMIT
              valueFrom:
                configMapKeyRef:
                  name: chris-cyber-hosted-q38-c4-addon-bootstrap-v2
                  key: package_commit
            - name: PACKAGE_SHA256
              valueFrom:
                configMapKeyRef:
                  name: chris-cyber-hosted-q38-c4-addon-bootstrap-v2
                  key: package_sha256
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: sfs
              mountPath: /mnt/sfs
      volumes:
        - name: bootstrap
          configMap:
            name: chris-cyber-hosted-q38-c4-addon-bootstrap-v2
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
