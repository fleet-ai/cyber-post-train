apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-q38-opencode11827-ded-tp1-r002-a1-v2
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: q38-ded-tp1-r002-a1-v2
    kueue.x-k8s.io/queue-name: training-lq
  annotations:
    cyber-post-train.fleet.ai/launch-authorized: "true"
    cyber-post-train.fleet.ai/serving-block: dedicated-qwen-tp1-v1
spec:
  activeDeadlineSeconds: 43200
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: q38-ded-tp1-r002-a1-v2
        kueue.x-k8s.io/queue-name: training-lq
    spec:
      restartPolicy: Never
      priorityClassName: fleet-serve-low
      preemptionPolicy: Never
      nodeSelector: {kubernetes.io/arch: amd64, workload: fleetai-training-ng-cpu}
      tolerations:
        - {key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}
      initContainers:
        - name: docker-cli
          image: &docker-image docker.io/library/docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              install -D -m 0755 /usr/local/bin/docker /cli/bin/docker;
              install -D -m 0755 /usr/local/libexec/docker/cli-plugins/docker-buildx /cli/plugins/docker-buildx;
              test "$(sha256sum /cli/bin/docker | awk '{print $1}')" = 242c7a8de606afba2acada7c7af00d77f92c3601678b2f3a60911b49a892c722;
              test "$(sha256sum /cli/plugins/docker-buildx | awk '{print $1}')" = 8c38f60308a895fa570f1410e453c5de11aafd65a99fa99965d96d24b6225a78
          resources:
            requests: {cpu: 10m, memory: 32Mi, ephemeral-storage: 32Mi}
            limits: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
          volumeMounts: [{name: docker-cli, mountPath: /cli}]
        - name: dind
          image: *docker-image
          restartPolicy: Always
          args: ["--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--tls=false"]
          readinessProbe: {tcpSocket: {port: 2375}, initialDelaySeconds: 2, periodSeconds: 2}
          securityContext: {privileged: true}
          resources:
            requests: {cpu: 500m, memory: 2Gi, ephemeral-storage: 20Gi}
            limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 40Gi}
          volumeMounts:
            - {name: docker-socket, mountPath: /var/run}
            - {name: docker-data, mountPath: /var/lib/docker}
            - {name: workspace, mountPath: /workspace}
            - {name: sfs, mountPath: /mnt/sfs}
      containers:
        - name: evaluator
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              root=/workspace/cyber-post-train
              mkdir -p "$root/evals/fleet/configs" "$root/evals/fleet/scripts"
              touch "$root/evals/__init__.py" "$root/evals/fleet/__init__.py"
              install -m 0644 /bootstrap/self_hosted.py "$root/evals/fleet/self_hosted.py"
              install -m 0644 /bootstrap/exact_pass4_crypto.py "$root/evals/fleet/exact_pass4_crypto.py"
              install -m 0644 /bootstrap/exact_pass4_universe.py "$root/evals/fleet/exact_pass4_universe.py"
              install -m 0644 /bootstrap/canary.py "$root/evals/fleet/qwen38_dedicated_scored_canary_v1.py"
              install -m 0644 /bootstrap/campaign.json "$root/evals/fleet/configs/q38-glm53-exact-easiest100-pass4-campaign-v1.json"
              install -m 0644 /bootstrap/selection.json "$root/evals/fleet/configs/opencode-easiest-train100-selection-v2.json"
              install -m 0644 /bootstrap/source.json "$root/evals/fleet/configs/qwen38-opencode-train50-pass4-v3.json"
              install -m 0644 /bootstrap/Dockerfile.opencode "$root/evals/fleet/Dockerfile.opencode"
              install -m 0644 /bootstrap/fixed_proxy.py "$root/evals/fleet/fixed_proxy.py"
              install -m 0755 /bootstrap/run.sh "$root/evals/fleet/scripts/run.sh"
              exec "$root/evals/fleet/scripts/run.sh"
          env:
            - {name: PATH, value: "/docker-cli/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"}
            - {name: DOCKER_CONFIG, value: "/workspace/docker-config"}
            - {name: DOCKER_HOST, value: "unix:///var/run/docker.sock"}
            - {name: DOCKER_TLS_CERTDIR, value: ""}
            - {name: JOB_UID, valueFrom: {fieldRef: {apiVersion: v1, fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']"}}}
            - {name: POD_UID, valueFrom: {fieldRef: {apiVersion: v1, fieldPath: metadata.uid}}}
            - {name: FLEET_API_KEY, valueFrom: {secretKeyRef: {name: chris-cyber-opencode-evals-v2, key: FLEET_API_KEY}}}
          resources:
            requests: {cpu: 100m, memory: 512Mi, ephemeral-storage: 5Gi}
            limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 20Gi}
          volumeMounts:
            - {name: docker-cli, mountPath: /docker-cli, readOnly: true}
            - {name: docker-socket, mountPath: /var/run}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: workspace, mountPath: /workspace}
            - {name: sfs, mountPath: /mnt/sfs}
      volumes:
        - {name: bootstrap, configMap: {name: chris-cyber-q38-ded-tp1-r002-a1-v2}}
        - {name: docker-cli, emptyDir: {sizeLimit: 256Mi}}
        - {name: docker-data, emptyDir: {sizeLimit: 40Gi}}
        - {name: docker-socket, emptyDir: {}}
        - {name: workspace, emptyDir: {sizeLimit: 5Gi}}
        - {name: sfs, persistentVolumeClaim: {claimName: sfs-shared}}
