apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-opencode-fleet-smokes-v1
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/experiment: opencode-qwen38-glm53-fleet-smokes-v1
    cyber-post-train.fleet.ai/owner: chris
    kueue.x-k8s.io/queue-name: training-lq
spec:
  activeDeadlineSeconds: 43200
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/experiment: opencode-qwen38-glm53-fleet-smokes-v1
        cyber-post-train.fleet.ai/owner: chris
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      initContainers:
        - name: dind
          image: docker.io/library/docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
          restartPolicy: Always
          args:
            - --host=unix:///var/run/docker.sock
            - --host=tcp://0.0.0.0:2375
            - --tls=false
          readinessProbe:
            tcpSocket:
              port: 2375
            initialDelaySeconds: 2
            periodSeconds: 2
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 40Gi
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: docker-data
              mountPath: /var/lib/docker
            - name: workspace
              mountPath: /workspace
            - name: sfs
              mountPath: /mnt/sfs
      containers:
        - name: evaluator
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              apt-get update
              apt-get install --yes --no-install-recommends docker.io=20.10.24+dfsg1-1+deb12u1+b6
              root=/workspace/cyber-post-train
              mkdir -p "$root/evals/fleet/configs" "$root/evals/fleet/scripts"
              touch "$root/evals/__init__.py" "$root/evals/fleet/__init__.py"
              install -m 0644 /bootstrap/Dockerfile.opencode "$root/evals/fleet/Dockerfile.opencode"
              install -m 0644 /bootstrap/fixed_proxy.py "$root/evals/fleet/fixed_proxy.py"
              install -m 0644 /bootstrap/self_hosted.py "$root/evals/fleet/self_hosted.py"
              install -m 0644 /bootstrap/qwen-config.json \
                "$root/evals/fleet/configs/qwen38-opencode-train-sweep-smoke-v1.json"
              install -m 0644 /bootstrap/glm-config.json \
                "$root/evals/fleet/configs/glm53-opencode-train-sweep-smoke-v1.json"
              install -m 0755 /bootstrap/run-smokes.sh \
                "$root/evals/fleet/scripts/run_opencode_train_sweep_smokes.sh"
              cd "$root"
              exec "$root/evals/fleet/scripts/run_opencode_train_sweep_smokes.sh"
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: FLEET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chris-cyber-opencode-evals-v1
                  key: FLEET_API_KEY
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 20Gi
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: sfs
              mountPath: /mnt/sfs
      volumes:
        - name: bootstrap
          configMap:
            name: chris-cyber-opencode-fleet-smokes-v1
        - name: docker-data
          emptyDir:
            sizeLimit: 40Gi
        - name: docker-socket
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 5Gi
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
