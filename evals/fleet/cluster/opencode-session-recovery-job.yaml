apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-opencode-fleet-smokes-v2-session-recovery-v1
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/experiment: opencode-qwen38-glm53-session-recovery-v1
    cyber-post-train.fleet.ai/owner: chris
    kueue.x-k8s.io/queue-name: training-lq
spec:
  activeDeadlineSeconds: 3600
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/experiment: opencode-qwen38-glm53-session-recovery-v1
        cyber-post-train.fleet.ai/owner: chris
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      containers:
        - name: recovery
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              root=/workspace/cyber-post-train
              mkdir -p "$root/evals/fleet/configs" "$root/evals/fleet/scripts"
              touch "$root/evals/__init__.py" "$root/evals/fleet/__init__.py"
              install -m 0644 /bootstrap/self_hosted.py "$root/evals/fleet/self_hosted.py"
              install -m 0644 /bootstrap/qwen-config.json \
                "$root/evals/fleet/configs/qwen38-opencode-train-sweep-smoke-v2.json"
              install -m 0644 /bootstrap/glm-config.json \
                "$root/evals/fleet/configs/glm53-opencode-train-sweep-smoke-v2.json"
              install -m 0755 /bootstrap/run-recovery.sh \
                "$root/evals/fleet/scripts/run_opencode_session_recovery.sh"
              cd "$root"
              exec "$root/evals/fleet/scripts/run_opencode_session_recovery.sh"
          env:
            - name: FLEET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: chris-cyber-opencode-evals-v2
                  key: FLEET_API_KEY
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: sfs
              mountPath: /mnt/sfs
      volumes:
        - name: bootstrap
          configMap:
            name: chris-cyber-opencode-fleet-smokes-v2-session-recovery-v1
        - name: workspace
          emptyDir:
            sizeLimit: 1Gi
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
