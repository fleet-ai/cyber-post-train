apiVersion: batch/v1
kind: Job
metadata:
  name: chris-glm53-exact100-hosted-r001-a1-canary-v3
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/experiment: glm53-exact100-hosted-r001-a1-canary-v3
    cyber-post-train.fleet.ai/owner: chris
    kueue.x-k8s.io/queue-name: training-lq
  annotations:
    cyber-post-train.fleet.ai/create-once: "true"
    cyber-post-train.fleet.ai/launch-authorized: "true"
spec:
  activeDeadlineSeconds: 43200
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/experiment: glm53-exact100-hosted-r001-a1-canary-v3
        cyber-post-train.fleet.ai/owner: chris
    spec:
      restartPolicy: Never
      priorityClassName: fleet-serve-low
      preemptionPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      initContainers:
        - name: dind
          image: docker.io/library/docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
          restartPolicy: Always
          args: ["--host=unix:///var/run/docker.sock", "--tls=false"]
          readinessProbe:
            exec: {command: ["docker", "info"]}
            initialDelaySeconds: 2
            periodSeconds: 2
          securityContext: {privileged: true}
          resources:
            requests: {cpu: 500m, memory: 2Gi, ephemeral-storage: 20Gi}
            limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 40Gi}
          volumeMounts:
            - {name: docker-socket, mountPath: /var/run}
            - {name: docker-data, mountPath: /var/lib/docker}
            - {name: workspace, mountPath: /workspace}
            - {name: sfs, mountPath: /mnt/sfs}
      containers:
        - name: evaluator
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              apt-get update
              apt-get install --yes --no-install-recommends docker.io=20.10.24+dfsg1-1+deb12u1+b6
              exec /bin/bash /bootstrap/run.sh
          env:
            - {name: DOCKER_HOST, value: "unix:///var/run/docker.sock"}
            - {name: DOCKER_TLS_CERTDIR, value: ""}
            - {name: JOB_NAME, value: chris-glm53-exact100-hosted-r001-a1-canary-v3}
            - {name: SECRET_UID, value: e0febd8e-94a2-46b0-a0bf-dd6b3154187b}
            - name: JOB_UID
              valueFrom: {fieldRef: {apiVersion: v1, fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']"}}
            - name: POD_UID
              valueFrom: {fieldRef: {apiVersion: v1, fieldPath: metadata.uid}}
            - name: FLEET_API_KEY
              valueFrom: {secretKeyRef: {name: chris-cyber-opencode-evals-v2, key: FLEET_API_KEY}}
          resources:
            requests: {cpu: 100m, memory: 512Mi, ephemeral-storage: 5Gi}
            limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 20Gi}
          volumeMounts:
            - {name: docker-socket, mountPath: /var/run}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: workspace, mountPath: /workspace}
            - {name: sfs, mountPath: /mnt/sfs}
      volumes:
        - name: bootstrap
          configMap: {name: chris-glm53-exact100-hosted-r001-a1-canary-v3-run}
        - {name: docker-data, emptyDir: {sizeLimit: 40Gi}}
        - {name: docker-socket, emptyDir: {}}
        - {name: workspace, emptyDir: {sizeLimit: 5Gi}}
        - name: sfs
          persistentVolumeClaim: {claimName: sfs-shared}
