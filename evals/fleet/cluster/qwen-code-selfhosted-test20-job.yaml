apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-qwen36-qcode-fleet-test20-base-v1
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/experiment: qwen36-qwen-code-fleet-test20-base-v1
    cyber-post-train.fleet.ai/owner: chris
    kueue.x-k8s.io/queue-name: training-lq
spec:
  activeDeadlineSeconds: 172800
  backoffLimit: 0
  suspend: true
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/experiment: qwen36-qwen-code-fleet-test20-base-v1
        cyber-post-train.fleet.ai/owner: chris
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: dind
          image: docker.io/library/docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
          restartPolicy: Always
          args:
            - --host=unix:///var/run/docker.sock
            - --host=tcp://0.0.0.0:2375
            - --tls=false
          readinessProbe:
            tcpSocket:
              port: 2375
            initialDelaySeconds: 2
            periodSeconds: 2
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 20Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 80Gi
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: docker-data
              mountPath: /var/lib/docker
            - name: workspace
              mountPath: /workspace
            - name: sfs
              mountPath: /mnt/sfs
      containers:
        - name: evaluator
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command:
            - /bin/bash
            - -ceu
            - --
          args:
            - |
              apt-get update
              apt-get install --yes --no-install-recommends \
                docker.io=20.10.24+dfsg1-1+deb12u1+b6
              rm -rf /var/lib/apt/lists/*
              root=/workspace/cyber-post-train
              mkdir -p \
                "$root/configs/data" \
                "$root/evals/fleet/cluster" \
                "$root/evals/fleet/configs" \
                "$root/evals/fleet/receipts" \
                "$root/evals/fleet/scripts"
              touch "$root/evals/__init__.py" "$root/evals/fleet/__init__.py"
              install -m 0644 /bootstrap/Dockerfile.qwen-code "$root/evals/fleet/Dockerfile.qwen-code"
              install -m 0644 /bootstrap/config.json \
                "$root/evals/fleet/configs/qwen36-27b-qwen-code-test20-base-v1.json"
              install -m 0644 /bootstrap/fixed_proxy.py "$root/evals/fleet/fixed_proxy.py"
              install -m 0644 /bootstrap/holdout.py "$root/evals/fleet/holdout.py"
              install -m 0644 /bootstrap/receipt.json \
                "$root/evals/fleet/receipts/qwen36-27b-qwen-code-test20-base-v1.json"
              install -m 0644 /bootstrap/self_hosted.py "$root/evals/fleet/self_hosted.py"
              install -m 0644 /bootstrap/split.json \
                "$root/configs/data/fleet-a62-task-split-v1.json"
              install -m 0755 /bootstrap/run_selfhosted_qwen_test20.sh \
                "$root/evals/fleet/scripts/run_selfhosted_qwen_test20.sh"
              cd "$root"
              exec "$root/evals/fleet/scripts/run_selfhosted_qwen_test20.sh"
          env:
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: FLEET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fleet-api
                  key: FLEET_API_KEY
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 10Gi
            limits:
              cpu: "4"
              memory: 8Gi
              ephemeral-storage: 20Gi
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: workspace
              mountPath: /workspace
            - name: sfs
              mountPath: /mnt/sfs
      volumes:
        - name: bootstrap
          configMap:
            name: chris-cyber-qwen36-qcode-fleet-test20-base-v1
        - name: docker-data
          emptyDir:
            sizeLimit: 80Gi
        - name: docker-socket
          emptyDir: {}
        - name: workspace
          emptyDir:
            sizeLimit: 10Gi
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
