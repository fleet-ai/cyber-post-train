apiVersion: v1
kind: List
items:
  - &canary
    apiVersion: batch/v1
    kind: Job
    metadata:
      name: chris-q38-ac-r004-a1-g2-v1
      namespace: fleet-train-jobs
      annotations: &held
        cyber-post-train.fleet.ai/preview-only: "true"
        cyber-post-train.fleet.ai/launch-authorized: "false"
    spec:
      activeDeadlineSeconds: 43200
      backoffLimit: 0
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            cyber-post-train.fleet.ai/experiment: q38-ac-r004-a1-g2-v3
            cyber-post-train.fleet.ai/owner: chris
            kueue.x-k8s.io/queue-name: training-lq
        spec:
          restartPolicy: Never
          priorityClassName: fleet-train-high
          preemptionPolicy: Never
          nodeSelector: {kubernetes.io/arch: amd64, workload: fleetai-training-ng-cpu}
          tolerations:
            - {key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}
          initContainers:
            - name: dind
              image: docker.io/library/docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
              restartPolicy: Always
              args: ["--host=unix:///var/run/docker.sock", "--host=tcp://0.0.0.0:2375", "--tls=false"]
              readinessProbe: {tcpSocket: {port: 2375}, initialDelaySeconds: 2, periodSeconds: 2}
              securityContext: {privileged: true}
              resources:
                requests: {cpu: 500m, memory: 2Gi, ephemeral-storage: 20Gi}
                limits: {cpu: "2", memory: 4Gi, ephemeral-storage: 40Gi}
              volumeMounts: &dind-mounts
                - {name: docker-socket, mountPath: /var/run}
                - {name: docker-data, mountPath: /var/lib/docker}
                - {name: workspace, mountPath: /workspace}
                - {name: sfs, mountPath: /mnt/sfs}
          containers:
            - name: evaluator
              image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
              command: ["/bin/bash", "-ceu", "--"]
              args: &bootstrap
                - |
                  apt-get update && apt-get install --yes --no-install-recommends docker.io=20.10.24+dfsg1-1+deb12u1+b6
                  root=/workspace/cyber-post-train
                  mkdir -p "$root/evals/fleet/configs" "$root/evals/fleet/scripts" "$root/evals/fleet/cluster" "$root/docs/evidence/qwen38-study"
                  touch "$root/evals/__init__.py" "$root/evals/fleet/__init__.py"
                  install -m 0644 /bootstrap/self_hosted.py "$root/evals/fleet/self_hosted.py"
                  install -m 0644 /bootstrap/runner.py "$root/evals/fleet/opencode_train_sweep_runner.py"
                  install -m 0644 /bootstrap/controller.py "$root/evals/fleet/hosted_sweep_controller.py"
                  install -m 0644 /bootstrap/canary_controller.py "$root/evals/fleet/autocontinue_canary_controller.py"
                  install -m 0644 /bootstrap/hosted_release.py "$root/evals/fleet/autocontinue_canary_hosted_release.py"
                  install -m 0644 /bootstrap/hosted_runtime.py "$root/evals/fleet/autocontinue_canary_hosted_runtime.py"
                  install -m 0644 /bootstrap/hosted_health.py "$root/evals/fleet/autocontinue_hosted_health.py"
                  install -m 0644 /bootstrap/endpoint_lease.py "$root/evals/fleet/endpoint_lease.py"
                  install -m 0644 /bootstrap/fixed_proxy.py "$root/evals/fleet/fixed_proxy.py"
                  install -m 0644 /bootstrap/exact_universe.py "$root/evals/fleet/exact_pass4_universe.py"
                  install -m 0644 /bootstrap/generation2_v1.py "$root/evals/fleet/autocontinue_generation2_canary.py"
                  install -m 0644 /bootstrap/generation2_v2.py "$root/evals/fleet/autocontinue_generation2_canary_v2.py"
                  install -m 0644 /bootstrap/generation2_v3.py "$root/evals/fleet/autocontinue_generation2_canary_v3.py"
                  install -m 0644 /bootstrap/runtime_v3.py "$root/evals/fleet/autocontinue_generation2_runtime_v3.py"
                  install -m 0644 /bootstrap/Dockerfile.opencode "$root/evals/fleet/Dockerfile.opencode"
                  install -m 0644 /bootstrap/q-spec.json "$root/evals/fleet/configs/qwen38-opencode-autocontinue-canary-generation2-v2.json"
                  install -m 0644 /bootstrap/g-spec.json "$root/evals/fleet/configs/glm53-opencode-autocontinue-canary-generation2-v2.json"
                  install -m 0644 /bootstrap/q-v1-spec.json "$root/evals/fleet/configs/qwen38-opencode-autocontinue-canary-generation2-v1.json"
                  install -m 0644 /bootstrap/g-v1-spec.json "$root/evals/fleet/configs/glm53-opencode-autocontinue-canary-generation2-v1.json"
                  install -m 0644 /bootstrap/q-predecessor.json "$root/evals/fleet/configs/qwen38-opencode-autocontinue-canary1-v2.json"
                  install -m 0644 /bootstrap/g-predecessor.json "$root/evals/fleet/configs/glm53-opencode-autocontinue-canary1-v2.json"
                  install -m 0644 /bootstrap/spec.json "$root/evals/fleet/configs/generation2-spec.json"
                  install -m 0644 /bootstrap/q-spec.json "$root/evals/fleet/configs/qwen-generation2-spec.json"
                  install -m 0644 /bootstrap/g-spec.json "$root/evals/fleet/configs/glm-generation2-spec.json"
                  install -m 0644 /bootstrap/campaign.json "$root/evals/fleet/configs/q38-glm53-exact-easiest100-pass4-campaign-v1.json"
                  install -m 0644 /bootstrap/selection.json "$root/evals/fleet/configs/opencode-easiest-train100-selection-v2.json"
                  install -m 0644 /bootstrap/incident.json "$root/docs/evidence/qwen38-study/2026-09-04-opencode-autocontinue-canary-v2-pre-model-failure.json"
                  install -m 0644 /bootstrap/tombstones.json "$root/docs/evidence/qwen38-study/2026-09-04-opencode-autocontinue-canary-generation1-tombstones-v1.json"
                  install -m 0644 /bootstrap/held-v1.json "$root/docs/evidence/qwen38-study/2026-09-04-opencode-autocontinue-generation2-canaries-held-v1.json"
                  install -m 0644 /bootstrap/held-v2.json "$root/docs/evidence/qwen38-study/2026-09-04-opencode-autocontinue-generation2-canaries-held-v2.json"
                  install -m 0644 /bootstrap/held-v3.json "$root/docs/evidence/qwen38-study/2026-09-04-opencode-autocontinue-generation2-canaries-held-v3.json"
                  install -m 0644 /bootstrap/executable-held.json "$root/evals/fleet/configs/generation2-executable-held.json"
                  install -m 0644 /bootstrap/v1-manifest.yaml "$root/evals/fleet/cluster/opencode-autocontinue-generation2-canaries-v1.yaml"
                  install -m 0755 /bootstrap/v1-run.sh "$root/evals/fleet/scripts/run_opencode_autocontinue_generation2_canary.sh"
                  install -m 0755 /bootstrap/v1-submit.sh "$root/evals/fleet/scripts/submit_opencode_autocontinue_generation2_canaries_v1.sh"
                  install -m 0644 /bootstrap/v2-manifest.yaml "$root/evals/fleet/cluster/opencode-autocontinue-generation2-canaries-v2.yaml"
                  install -m 0755 /bootstrap/v2-run.sh "$root/evals/fleet/scripts/run_opencode_autocontinue_generation2_canary_v2.sh"
                  install -m 0755 /bootstrap/v2-submit.sh "$root/evals/fleet/scripts/submit_opencode_autocontinue_generation2_canaries_v2.sh"
                  install -m 0644 /bootstrap/v3-manifest.yaml "$root/evals/fleet/cluster/opencode-autocontinue-generation2-canaries-v3.yaml"
                  install -m 0755 /bootstrap/v3-run.sh "$root/evals/fleet/scripts/run_opencode_autocontinue_generation2_canary_v3.sh"
                  install -m 0755 /bootstrap/v3-submit.sh "$root/evals/fleet/scripts/submit_opencode_autocontinue_generation2_canaries_v3.sh"
                  install -m 0644 /bootstrap/release.json "$root/evals/fleet/configs/generation2-release.json"
                  install -m 0644 /bootstrap/launch-route.json "$root/evals/fleet/configs/generation2-launch-route.json"
                  cd "$root" && exec "$root/evals/fleet/scripts/run_opencode_autocontinue_generation2_canary_v3.sh"
              env:
                - {name: DOCKER_HOST, value: "unix:///var/run/docker.sock"}
                - {name: DOCKER_TLS_CERTDIR, value: ""}
                - {name: GENERATION2_JOB_NAME, value: chris-q38-ac-r004-a1-g2-v1}
                - {name: GENERATION2_SPEC_FILE, value: generation2-spec.json}
                - {name: GENERATION2_RELEASE_FILE, value: generation2-release.json}
                - {name: GENERATION2_LAUNCH_ROUTE_FILE, value: generation2-launch-route.json}
                - {name: PACKAGE_COMMIT, valueFrom: {configMapKeyRef: {name: chris-q38-ac-r004-a1-g2-run-v1, key: package_commit}}}
                - {name: GENERATION2_AUTHORIZED_AT_UTC, valueFrom: {configMapKeyRef: {name: chris-q38-ac-r004-a1-g2-run-v1, key: authorized_at_utc}}}
                - {name: GENERATION2_AUTHORIZATION_STATEMENT, valueFrom: {configMapKeyRef: {name: chris-q38-ac-r004-a1-g2-run-v1, key: authorization_statement}}}
                - {name: JOB_UID, valueFrom: {fieldRef: {apiVersion: v1, fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']"}}}
                - {name: POD_UID, valueFrom: {fieldRef: {apiVersion: v1, fieldPath: metadata.uid}}}
                - {name: FLEET_API_KEY, valueFrom: {secretKeyRef: {name: chris-cyber-opencode-evals-v2, key: FLEET_API_KEY}}}
              resources:
                requests: {cpu: 100m, memory: 512Mi, ephemeral-storage: 5Gi}
                limits: {cpu: "1", memory: 2Gi, ephemeral-storage: 20Gi}
              volumeMounts: &evaluator-mounts
                - {name: docker-socket, mountPath: /var/run}
                - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
                - {name: workspace, mountPath: /workspace}
                - {name: sfs, mountPath: /mnt/sfs}
          volumes:
            - {name: bootstrap, configMap: {name: chris-q38-ac-r004-a1-g2-run-v1}}
            - {name: docker-data, emptyDir: {sizeLimit: 40Gi}}
            - {name: docker-socket, emptyDir: {}}
            - {name: workspace, emptyDir: {sizeLimit: 5Gi}}
            - {name: sfs, persistentVolumeClaim: {claimName: sfs-shared}}
