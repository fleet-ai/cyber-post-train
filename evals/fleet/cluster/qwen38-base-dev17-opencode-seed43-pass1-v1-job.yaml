apiVersion: batch/v1
kind: Job
metadata:
  name: chris-q38-dev17-s43-base-p1-v1
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/experiment: chris-q38-dev17-s43-base-p1-v1
    cyber-post-train.fleet.ai/owner: chris
    kueue.x-k8s.io/queue-name: training-lq
  annotations:
    fleet.ai/failure-alerts: "off"
    cyber-post-train.fleet.ai/create-once: "true"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/experiment: chris-q38-dev17-s43-base-p1-v1
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/postgres-client: "true"
    spec:
      priorityClassName: c1
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/arch: amd64
        workload: fleetai-training-ng-cpu
      tolerations:
        - {key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}
      initContainers:
        - name: dind
          image: docker.io/library/docker@sha256:f649ef046008ca7f926a2571c32b0ac22e5c59eb61b959617f9acc2a4c638cf5
          restartPolicy: Always
          args: [--host=unix:///var/run/docker.sock, --tls=false]
          securityContext: {privileged: true}
          resources:
            requests: {cpu: "2", memory: 2Gi, ephemeral-storage: 10Gi}
            limits: {cpu: "4", memory: 4Gi, ephemeral-storage: 40Gi}
          volumeMounts:
            - {name: docker-socket, mountPath: /var/run}
            - {name: docker-data, mountPath: /var/lib/docker}
            - {name: docker-bind, mountPath: /docker-bind}
            - {name: workspace, mountPath: /workspace}
            - {name: sfs, mountPath: /mnt/sfs}
      containers:
        - name: evaluator
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command: [/bin/bash, -ceu, --]
          args:
            - |
              apt-get update
              apt-get install --yes --no-install-recommends docker.io
              exec /bin/bash /bootstrap/run.sh
          env:
            - {name: DOCKER_HOST, value: "unix:///var/run/docker.sock"}
            - {name: DOCKER_TLS_CERTDIR, value: ""}
            - {name: DOCKER_BIND_ROOT, value: /docker-bind}
            - {name: EVAL_CONFIG_NAME, value: qwen38-base-fleet-dev17-opencode-seed43-pass1-v1.json}
            - {name: EVAL_OUTPUT, value: /mnt/sfs/jobs/chris-q38-fleet-dev17-s43-base-p1-v1}
            - {name: EVAL_DATABASE, value: q38_dev17_s43_base_p1_v1}
            - name: FLEET_API_KEY
              valueFrom:
                secretKeyRef: {name: chris-cyber-opencode-evals-v2, key: FLEET_API_KEY}
            - name: ROLLOUT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {name: chris-cyber-rollout-postgres-v1, key: ROLLOUT_DATABASE_URL}
          resources:
            requests: {cpu: "4", memory: 32Gi, ephemeral-storage: 10Gi}
            limits: {cpu: "8", memory: 48Gi, ephemeral-storage: 40Gi}
          volumeMounts:
            - {name: docker-socket, mountPath: /var/run}
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: docker-bind, mountPath: /docker-bind}
            - {name: workspace, mountPath: /workspace}
            - {name: sfs, mountPath: /mnt/sfs}
      volumes:
        - name: bootstrap
          configMap: {name: chris-q38-dev17-s43-base-code-v1}
        - name: docker-data
          emptyDir: {sizeLimit: 80Gi}
        - name: docker-socket
          emptyDir: {}
        - name: docker-bind
          emptyDir: {sizeLimit: 2Gi}
        - name: workspace
          emptyDir: {sizeLimit: 5Gi}
        - name: sfs
          persistentVolumeClaim: {claimName: sfs-shared}
