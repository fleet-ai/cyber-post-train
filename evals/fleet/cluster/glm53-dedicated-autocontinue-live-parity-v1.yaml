apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-glm53-dedicated-autocontinue-parity-v1
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/experiment: glm53-dedicated-autocontinue-parity-v1
    cyber-post-train.fleet.ai/owner: chris
    kueue.x-k8s.io/queue-name: training-lq
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/experiment: glm53-dedicated-autocontinue-parity-v1
        cyber-post-train.fleet.ai/owner: chris
    spec:
      restartPolicy: Never
      priorityClassName: fleet-train-high
      nodeSelector: {kubernetes.io/arch: amd64, workload: fleetai-training-ng-cpu}
      tolerations:
        - {key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}
      containers:
        - name: parity
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command: ["python", "-c"]
          args:
            - |
              import hashlib, json, os, pathlib, urllib.error, urllib.request

              OUT = pathlib.Path("/mnt/sfs/jobs/chris-cyber-glm53-dedicated-autocontinue-parity-v1")
              JOB_UID = os.environ["JOB_UID"]
              POD_UID = os.environ["POD_UID"]
              CAMPAIGN_PATH = "evals/fleet/configs/q38-glm53-opencode-autocontinue-primary-campaign-v1.json"
              CAMPAIGN_SHA256 = "sha256:1f4b63897fa8f954b2ea9ccb2532d65329737d959e74ef68fd8238d2532ee971"
              MODEL_REVISION = "30333038ada1f1dacb294a93270305a890b50c14"
              RUNTIME_IMAGE = "ghcr.io/fleet-ai/cyber-post-train-glm53-runtime@sha256:ec93ba50613fd13fb4c0b0a9105767ab18209a1e0108dab0923aad694c0206ec"
              CONTEXT_POLICY = "opencode_1.18.27_native_compaction_autocontinue_v1"
              SETTINGS_CANONICAL = "sha256:9614806454c86784e54fde31a8acc3f51adda11593fad3e762142cd04a4010f2"
              SETTINGS_FILE = "sha256:84a1ca763a297bd8badb184391a02c82d57069b9a211ecef4f5e53dd79e20e20"
              REPLICAS = [
                  {
                      "replica": "A",
                      "base": "http://ft-run-98c32208-5gpb2-head-svc:8000",
                      "ray_job_uid": "ef7cb0f2-84d4-4017-ae31-bf34ebb70d0d",
                      "ray_cluster_uid": "5107d72e-ae6a-4582-a490-55b349421d06",
                      "service_uid": "2c0e64de-c4a0-4f70-ae07-d15b1adad0b3",
                      "head_pod_uid": "3f37ab91-4afa-4e4d-8f29-a3eeda70a774",
                  },
                  {
                      "replica": "B",
                      "base": "http://ft-run-9e92209d-pppzg-head-svc:8000",
                      "ray_job_uid": "2bbfd34a-d74a-4497-ab28-48cada0c9753",
                      "ray_cluster_uid": "f7f7ae34-6a79-482a-b771-4639b786f66a",
                      "service_uid": "14ae906a-60ef-4a02-b6bf-814a00c2c89f",
                      "head_pod_uid": "bfeb4c6a-9e4a-4f14-adb2-3f516dd25fdb",
                  },
              ]

              def canonical(value):
                  return json.dumps(value, sort_keys=True, separators=(",", ":")).encode()

              def digest_without(value, field):
                  return "sha256:" + hashlib.sha256(canonical({k: v for k, v in value.items() if k != field})).hexdigest()

              def write_once(path, value):
                  fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
                  with os.fdopen(fd, "wb") as handle:
                      handle.write(canonical(value) + b"\n")

              def request(base, method, route, payload=None):
                  body = canonical(payload) if payload is not None else None
                  req = urllib.request.Request(
                      base + route,
                      method=method,
                      data=body,
                      headers={"Accept": "application/json", "Content-Type": "application/json"},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=300) as response:
                          raw = response.read()
                          return response.status, json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      raise RuntimeError("non-scored serving probe request failed") from exc

              settings = {
                  "$schema": "https://opencode.ai/config.json",
                  "compaction": {"auto": True, "reserved": 20000},
                  "mcp": {"fleet": {"enabled": True, "type": "remote", "url": "http://fleet-mcp-proxy:8090/mcp"}},
                  "permission": {"*": "deny", "fleet_*": "allow"},
                  "provider": {"fleet-cluster": {
                      "models": {"glm-5.3": {
                          "interleaved": "reasoning_content",
                          "limit": {"context": 262144, "input": 229376, "output": 32768},
                          "name": "glm-5.3", "reasoning": True, "tool_call": True,
                      }},
                      "name": "Fleet cluster inference", "npm": "@ai-sdk/openai-compatible",
                      "options": {"apiKey": "local-proxy-only", "baseURL": "http://model-proxy:8877/v1", "chunkTimeout": 300000, "timeout": False},
                  }},
                  "tools": {"bash": False, "edit": False, "glob": False, "grep": False, "list": False, "read": False, "skill": False, "task": False, "webfetch": False, "websearch": False},
              }
              settings_bytes = canonical(settings)
              assert "sha256:" + hashlib.sha256(settings_bytes).hexdigest() == SETTINGS_CANONICAL
              assert "sha256:" + hashlib.sha256(settings_bytes + b"\n").hexdigest() == SETTINGS_FILE
              assert settings["compaction"] == {"auto": True, "reserved": 20000}
              assert "plugin" not in settings
              assert settings["provider"]["fleet-cluster"]["models"]["glm-5.3"]["limit"] == {"context": 262144, "input": 229376, "output": 32768}

              tool_schemas = [
                  {"type": "function", "function": {"name": "bash", "description": "Run a shell command.", "parameters": {"type": "object", "properties": {"command": {"type": "string"}}, "required": ["command"], "additionalProperties": False}}},
                  {"type": "function", "function": {"name": "submit_report", "description": "Submit the final report.", "parameters": {"type": "object", "properties": {"report": {"type": "string"}}, "required": ["report"], "additionalProperties": False}}},
              ]
              def tool_payload(name):
                  if name == "bash":
                      instruction = "Call bash exactly once with the benign command true. Do not call submit_report."
                  elif name == "submit_report":
                      instruction = "Call submit_report exactly once with a brief benign status. Do not call bash."
                  else:
                      raise RuntimeError("unsupported parity tool")
                  return {
                      "model": "glm-5.3",
                      "messages": [{"role": "user", "content": instruction}],
                      "tools": tool_schemas,
                      "tool_choice": {"type": "function", "function": {"name": name}},
                      "temperature": 0,
                      "max_tokens": 128,
                  }

              if OUT.exists():
                  raise RuntimeError("single-use parity output root already exists")
              os.mkdir(OUT, 0o700)
              os.mkdir(OUT / "replicas", 0o700)
              receipts = []
              for replica in REPLICAS:
                  health_status, _ = request(replica["base"], "GET", "/health")
                  models_status, models = request(replica["base"], "GET", "/v1/models")
                  info_status, info = request(replica["base"], "GET", "/get_model_info")
                  server_status, server = request(replica["base"], "GET", "/get_server_info")
                  assert health_status == models_status == info_status == server_status == 200
                  assert [row.get("id") for row in models.get("data", [])] == ["glm-5.3"]
                  assert info.get("model_path") == info.get("tokenizer_path") == "/mnt/sfs/models/glm-5.3-30333038"
                  assert server.get("model_path") == server.get("tokenizer_path") == "/mnt/sfs/models/glm-5.3-30333038"
                  assert server.get("context_length") == 262144 and server.get("tp_size") == server.get("dp_size") == 8
                  selected = []
                  finish_reasons = []
                  for tool_name in ["bash", "submit_report"]:
                      completion_status, completion = request(replica["base"], "POST", "/v1/chat/completions", tool_payload(tool_name))
                      assert completion_status == 200 and completion.get("model") == "glm-5.3"
                      choices = completion.get("choices") or []
                      assert len(choices) == 1
                      choice = choices[0]
                      calls = (choice.get("message") or {}).get("tool_calls") or []
                      assert len(calls) == 1
                      function = (calls[0].get("function") or {})
                      arguments = json.loads(function.get("arguments") or "")
                      assert isinstance(arguments, dict) and function.get("name") == tool_name
                      if tool_name == "bash":
                          assert arguments == {"command": "true"}
                      else:
                          assert set(arguments) == {"report"} and isinstance(arguments["report"], str) and arguments["report"]
                      assert choice.get("finish_reason") == "tool_calls"
                      selected.append(tool_name)
                      finish_reasons.append("tool_calls")
                  assert selected == ["bash", "submit_report"]
                  receipt = {
                      "schema_version": "fleet-glm53-dedicated-autocontinue-live-parity-replica-v1",
                      "probe_job_uid": JOB_UID, "probe_pod_uid": POD_UID,
                      "campaign_path": CAMPAIGN_PATH, "campaign_sha256": CAMPAIGN_SHA256,
                      "replica": replica["replica"],
                      "ray_job_uid": replica["ray_job_uid"], "ray_cluster_uid": replica["ray_cluster_uid"],
                      "service_uid": replica["service_uid"], "head_pod_uid": replica["head_pod_uid"],
                      "runtime_image": RUNTIME_IMAGE, "model_revision": MODEL_REVISION,
                      "model_revision_provenance": "immutable_dedicated_v5_config_bound_to_exact_runtime_uids_and_image",
                      "served_model": "glm-5.3", "context_length": 262144, "tp_size": 8, "dp_size": 8,
                      "opencode_version": "1.18.27", "context_management": CONTEXT_POLICY,
                      "settings_canonical_sha256": SETTINGS_CANONICAL, "settings_file_sha256": SETTINGS_FILE,
                      "structured_tool_schema_names": ["bash", "submit_report"],
                      "selected_tool_names": selected, "finish_reasons": finish_reasons, "tool_arguments_valid_json": True,
                      "non_scored_model_requests": 2, "fleet_api_contacted": False, "task_instance_created": False,
                      "scoring_executed": False, "verifier_executed": False, "response_content_included": False,
                      "tool_arguments_included": False, "prompts_or_traces_included": False, "scores_included": False,
                  }
                  receipt["receipt_sha256"] = digest_without(receipt, "receipt_sha256")
                  write_once(OUT / "replicas" / (replica["replica"] + ".json"), receipt)
                  receipts.append(receipt)
              terminal = {
                  "schema_version": "fleet-glm53-dedicated-autocontinue-live-parity-terminal-v1",
                  "probe_job_uid": JOB_UID, "probe_pod_uid": POD_UID,
                  "campaign_path": CAMPAIGN_PATH, "campaign_sha256": CAMPAIGN_SHA256,
                  "replicas": 2, "replica_receipt_sha256s": [row["receipt_sha256"] for row in receipts],
                  "runtime_image": RUNTIME_IMAGE, "model_revision": MODEL_REVISION,
                  "model_revision_provenance": "immutable_dedicated_v5_configs_bound_to_exact_runtime_uids_and_image",
                  "context_length": 262144,
                  "opencode_version": "1.18.27", "context_management": CONTEXT_POLICY,
                  "settings_canonical_sha256": SETTINGS_CANONICAL, "settings_file_sha256": SETTINGS_FILE,
                  "structured_tool_schema_names": ["bash", "submit_report"], "selected_tool_names_per_replica": ["bash", "submit_report"],
                  "non_scored_model_requests": 4,
                  "fleet_api_contacted": False, "task_instance_created": False, "scoring_executed": False,
                  "verifier_executed": False, "prompts_or_traces_included": False, "scores_included": False,
                  "classification": "operational_gate_passed_no_capability_claim",
              }
              terminal["receipt_sha256"] = digest_without(terminal, "receipt_sha256")
              write_once(OUT / "TERMINAL.json", terminal)
              print(json.dumps({"ok": True, "replicas": 2, "non_scored_model_requests": 4, "receipt_sha256": terminal["receipt_sha256"]}, sort_keys=True))
          env:
            - name: JOB_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/controller-uid']
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 128Mi}
            limits: {cpu: 500m, memory: 512Mi, ephemeral-storage: 512Mi}
          volumeMounts: [{name: sfs, mountPath: /mnt/sfs}]
      volumes:
        - {name: sfs, persistentVolumeClaim: {claimName: sfs-shared}}
