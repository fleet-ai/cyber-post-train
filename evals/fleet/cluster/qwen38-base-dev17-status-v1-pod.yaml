apiVersion: v1
kind: Pod
metadata:
  name: chris-q38-base-dev17-status-v1
  namespace: fleet-train-jobs
  labels:
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/postgres-client: "true"
spec:
  restartPolicy: Never
  nodeSelector: {kubernetes.io/arch: amd64, workload: fleetai-training-ng-cpu}
  tolerations:
    - {key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}
  containers:
    - name: status
      image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
      command:
        - uv
        - run
        - --no-project
        - --with
        - psycopg[binary]==3.3.5
        - python
        - -c
        - |
          import json
          import os
          from urllib.parse import urlsplit, urlunsplit

          import psycopg

          admin = os.environ["ROLLOUT_DATABASE_URL"]
          database = "q38_base_dev17_p1_v1"
          connection = psycopg.connect(admin, connect_timeout=30)
          exists = connection.execute(
              "SELECT EXISTS(SELECT 1 FROM pg_database WHERE datname = %s)",
              (database,),
          ).fetchone()[0]
          connection.close()
          if not exists:
              print(json.dumps({"database_exists": False}))
              raise SystemExit
          parsed = urlsplit(admin)
          dsn = urlunsplit((parsed.scheme, parsed.netloc, "/" + database, parsed.query, ""))
          connection = psycopg.connect(dsn, connect_timeout=30)
          states = dict(connection.execute(
              "SELECT state, COUNT(*) FROM rollout_cells GROUP BY state"
          ).fetchall())
          blocks = connection.execute(
              "SELECT serving_block, state, COUNT(*) FROM rollout_cells "
              "GROUP BY serving_block, state ORDER BY serving_block, state"
          ).fetchall()
          total = connection.execute("SELECT COUNT(*) FROM rollout_cells").fetchone()[0]
          local_results = connection.execute(
              "SELECT COUNT(*) FROM rollout_local_results"
          ).fetchone()[0]
          plan = connection.execute(
              "SELECT value FROM ledger_metadata WHERE key = 'plan_sha256'"
          ).fetchone()
          connection.close()
          print(json.dumps({
              "database_exists": True,
              "total": total,
              "states": states,
              "by_serving_block": blocks,
              "local_results": local_results,
              "plan_sha256": plan[0] if plan else None,
          }, sort_keys=True))
      env:
        - name: ROLLOUT_DATABASE_URL
          valueFrom:
            secretKeyRef: {name: chris-cyber-rollout-postgres-v1, key: ROLLOUT_DATABASE_URL}
      resources:
        requests: {cpu: 50m, memory: 128Mi}
        limits: {cpu: 500m, memory: 512Mi}
