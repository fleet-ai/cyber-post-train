apiVersion: batch/v1
kind: Job
metadata:
  name: chris-q38-ac-canary1-v3-preflight
  namespace: fleet-train-jobs
  annotations: {cyber-post-train.fleet.ai/preview-only: "true", cyber-post-train.fleet.ai/launch-authorized: "false"}
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: {cyber-post-train.fleet.ai/experiment: q38-ac-canary1-pre-v3, cyber-post-train.fleet.ai/owner: chris, kueue.x-k8s.io/queue-name: training-lq}
    spec:
      restartPolicy: Never
      priorityClassName: fleet-train-high
      nodeSelector: {kubernetes.io/arch: amd64, workload: fleetai-training-ng-cpu}
      tolerations: [{key: workload, operator: Equal, value: fleetai-training-ng-cpu, effect: NoSchedule}]
      containers:
        - name: preflight
          image: ghcr.io/astral-sh/uv:python3.12-bookworm@sha256:9aa60c50016c0485636ab9a830246a6ef3399aa4a8bab3d17ef4a2358fba2ca7
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              root=/workspace/cyber-post-train
              mkdir -p "$root/evals/fleet/configs" "$root/evals/fleet/cluster" "$root/docs/evidence/qwen38-study"
              touch "$root/evals/__init__.py" "$root/evals/fleet/__init__.py"
              for file in self_hosted.py runner.py controller.py canary_controller.py endpoint_lease.py; do install -m 0644 "/bootstrap/$file" "$root/evals/fleet/$file"; done
              mv "$root/evals/fleet/runner.py" "$root/evals/fleet/opencode_train_sweep_runner.py"
              mv "$root/evals/fleet/controller.py" "$root/evals/fleet/hosted_sweep_controller.py"
              mv "$root/evals/fleet/canary_controller.py" "$root/evals/fleet/autocontinue_canary_controller.py"
              install -m 0644 /bootstrap/campaign.json "$root/evals/fleet/configs/q38-glm53-opencode-autocontinue-primary-campaign-v1.json"
              install -m 0644 /bootstrap/preflight-manifest.yaml "$root/evals/fleet/cluster/opencode-autocontinue-canary-preflights-v3.yaml"
              install -m 0644 /bootstrap/compatibility.json "$root/docs/evidence/qwen38-study/2026-09-04-opencode-autocontinue-canary-controller-compatibility-v3.json"
              install -m 0644 /bootstrap/scored-v1-incident.json "$root/docs/evidence/qwen38-study/2026-09-04-opencode-autocontinue-canary-scored-v1-bootstrap-failure.json"
              cd "$root"
              exec uv run --no-project --with httpx==0.28.1 python -m evals.fleet.autocontinue_canary_controller preflight --plan /bootstrap/plan.json --release /bootstrap/release.json --out /mnt/sfs/jobs/chris-q38-ac-canary1-v3-preflight/PREFLIGHT.json --out-dir /mnt/sfs/jobs/chris-q38-ac-canary1-v2 --repo "$root" --package-commit "$PACKAGE_COMMIT" --plan-file-sha256 "$PLAN_FILE_SHA256" --authorized-at-utc "$AUTHORIZED_AT_UTC" --authorization-statement "$AUTHORIZATION_STATEMENT"
          env:
            - {name: JOB_UID, valueFrom: {fieldRef: {apiVersion: v1, fieldPath: "metadata.labels['batch.kubernetes.io/controller-uid']"}}}
            - {name: POD_UID, valueFrom: {fieldRef: {apiVersion: v1, fieldPath: metadata.uid}}}
            - {name: PACKAGE_COMMIT, valueFrom: {configMapKeyRef: {name: chris-q38-ac-canary1-pre-v3, key: package_commit}}}
            - {name: PLAN_FILE_SHA256, valueFrom: {configMapKeyRef: {name: chris-q38-ac-canary1-pre-v3, key: plan_file_sha256}}}
            - {name: AUTHORIZED_AT_UTC, valueFrom: {configMapKeyRef: {name: chris-q38-ac-canary1-pre-v3, key: authorized_at_utc}}}
            - {name: AUTHORIZATION_STATEMENT, valueFrom: {configMapKeyRef: {name: chris-q38-ac-canary1-pre-v3, key: authorization_statement}}}
            - {name: FLEET_API_KEY, valueFrom: {secretKeyRef: {name: chris-cyber-opencode-evals-v2, key: FLEET_API_KEY}}}
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 250m, memory: 512Mi}}
          volumeMounts: [{name: bootstrap, mountPath: /bootstrap, readOnly: true}, {name: workspace, mountPath: /workspace}, {name: sfs, mountPath: /mnt/sfs}]
      volumes:
        - {name: bootstrap, configMap: {name: chris-q38-ac-canary1-pre-v3}}
        - {name: workspace, emptyDir: {sizeLimit: 1Gi}}
        - {name: sfs, persistentVolumeClaim: {claimName: sfs-shared}}
---
