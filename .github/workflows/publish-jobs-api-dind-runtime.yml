name: Publish Jobs API DinD evaluation runtime

on:
  push:
    branches:
      - 'codex/jobs-api-dind-runtime-main-v1'
    paths:
      - '.github/workflows/publish-jobs-api-dind-runtime.yml'
      - 'evals/fleet/images/sglang-ray/Dockerfile.jobs-api-dind'
      - 'tests/test_jobs_api_dind_runtime.py'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: evals/fleet/images/sglang-ray/Dockerfile.jobs-api-dind
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/fleet-ai/cyber-post-train-eval-runtime:jobs-api-dind-${{ github.sha }}

