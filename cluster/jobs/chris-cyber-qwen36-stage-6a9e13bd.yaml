apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-qwen36-stage-6a9e13bd
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: qwen36-stage-6a9e13bd
    cyber-post-train.fleet.ai/model: qwen36
spec:
  suspend: true
  backoffLimit: 3
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: training-lq
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: qwen36-stage-6a9e13bd
        cyber-post-train.fleet.ai/model: qwen36
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: ghcr-pull
      nodeSelector:
        workload: fleetai-training-ng-cpu
      tolerations:
      - key: workload
        operator: Equal
        value: fleetai-training-ng-cpu
        effect: NoSchedule
      containers:
      - name: stage
        image: ghcr.io/fleet-ai/miles-fleet/trainer@sha256:98920a4e25fadc3f31fafc18eff072313386edf5b352a23d13f4bb2d9e5f0a4c
        env:
        - name: HF_HOME
          value: /mnt/sfs/hf-cache/chris-cyber-qwen36
        - name: HF_XET_HIGH_PERFORMANCE
          value: "1"
        - name: HF_XET_NUM_CONCURRENT_RANGE_GETS
          value: "32"
        command: ["/bin/bash", "-ceu", "--"]
        args:
        - |
          repo=Qwen/Qwen3.6-27B
          revision=6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
          expected_manifest=14ad10368de9b9e5974ff12a4b70ea7884194b58e670177bbac79daeb81f16b9
          parent=/mnt/sfs/models/Qwen/Qwen3.6-27B
          partial="$parent/.partial-$revision"
          final="$parent/$revision"
          mkdir -p "$parent" "$partial"
          if [[ -f "$final/.cyber-post-train-lock.json" ]]; then
            python - "$final/.cyber-post-train-lock.json" "$revision" "$expected_manifest" <<'PY'
          import json
          import sys
          lock = json.load(open(sys.argv[1]))
          assert lock["revision"] == sys.argv[2]
          assert lock["weights_manifest_sha256"] == "sha256:" + sys.argv[3]
          assert lock["verified_shards"] == 15
          print("CHECKPOINT_ALREADY_VERIFIED", sys.argv[2])
          PY
            exit 0
          fi
          test ! -e "$final"
          python - "$revision" "$partial/source-tree.json" "$expected_manifest" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request
          revision, output, expected = sys.argv[1:]
          url = f"https://huggingface.co/api/models/Qwen/Qwen3.6-27B/tree/{revision}?recursive=true&limit=1000"
          with urllib.request.urlopen(url, timeout=60) as response:
              tree = json.load(response)
          shards = sorted(
              ({"path": item["path"], "size": item["size"], "sha256": item["lfs"]["oid"]}
               for item in tree
               if item["path"].startswith("model-") and item["path"].endswith("-of-00015.safetensors")),
              key=lambda item: item["path"],
          )
          assert len(shards) == 15
          encoded = json.dumps(shards, sort_keys=True, separators=(",", ":")).encode()
          assert hashlib.sha256(encoded).hexdigest() == expected
          with open(output, "w") as handle:
              json.dump({"revision": revision, "shards": shards}, handle, sort_keys=True)
          print("REMOTE_MANIFEST_VERIFIED", len(shards), expected)
          PY
          hf download "$repo" --revision "$revision" --local-dir "$partial" --max-workers 32
          python - "$partial" "$revision" "$expected_manifest" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          revision = sys.argv[2]
          expected_manifest = sys.argv[3]
          tree = json.loads((root / "source-tree.json").read_text())
          for index, shard in enumerate(tree["shards"], 1):
              path = root / shard["path"]
              assert path.stat().st_size == shard["size"], shard["path"]
              with path.open("rb") as handle:
                  actual = hashlib.file_digest(handle, "sha256").hexdigest()
              assert actual == shard["sha256"], shard["path"]
              print("VERIFIED_SHARDS", index, flush=True)
          small_files = {
              "chat_template.jinja": "e84f32a23fdda27689f868aa4a1a5621f41133e51a48d7f3efcbea2839574259",
              "config.json": "69db4eb7196bc8190813231b3018ca05d8c2e3abc7b1af19d55c157af44a9d9c",
              "configuration.json": "2d4464e2ead06bc9bc718c781309ad1e7baded626d66e8dcdc8b469ba185faf0",
              "generation_config.json": "e70c136c1b78ddc1fb0905bac8e733a4dc448d4f852a5dd75143fffc70be550e",
              "model.safetensors.index.json": "a8ad2c26fb707ff8c245806315b03e3b4b74595528492423af5dae0ce39b4d9b",
              "tokenizer.json": "5f9e4d4901a92b997e463c1f46055088b6cca5ca61a6522d1b9f64c4bb81cb42",
              "tokenizer_config.json": "5186f0defcd7f232382c7f0aebcd2252d073bb921ab240e407b7ae8745d2b29b",
          }
          for name, expected in small_files.items():
              with (root / name).open("rb") as handle:
                  assert hashlib.file_digest(handle, "sha256").hexdigest() == expected, name
          lock = {
              "schema": "cyber_post_train_checkpoint_lock_v1",
              "repo": "Qwen/Qwen3.6-27B",
              "revision": revision,
              "weights_manifest_sha256": "sha256:" + expected_manifest,
              "verified_shards": 15,
              "verified_bytes": sum(item["size"] for item in tree["shards"]),
              "small_file_sha256": small_files,
          }
          temporary = root / ".cyber-post-train-lock.json.tmp"
          temporary.write_text(json.dumps(lock, indent=2, sort_keys=True) + "\n")
          os.replace(temporary, root / ".cyber-post-train-lock.json")
          print("LOCAL_CHECKPOINT_VERIFIED", revision)
          PY
          mv "$partial" "$final"
          echo "CHECKPOINT_PROMOTED $final"
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: "16"
            memory: 32Gi
            ephemeral-storage: 40Gi
        volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
      volumes:
      - name: sfs
        persistentVolumeClaim:
          claimName: sfs-shared
