apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-glm52-model-inventory
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: model-inventory-b4734de4
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: model-inventory-b4734de4
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: inventory
          image: ghcr.io/fleet-ai/miles-fleet/trainer@sha256:98920a4e25fadc3f31fafc18eff072313386edf5b352a23d13f4bb2d9e5f0a4c
          command: ["/bin/bash", "-ceu", "--"]
          args:
            - |
              echo "MODEL_INVENTORY_V1"
              for root in /mnt/sfs/models /mnt/sfs/huggingface /mnt/sfs/model-cache; do
                if [[ -d "$root" ]]; then
                  echo "ROOT $root"
                  find "$root" -mindepth 1 -maxdepth 2 -type d -printf '%p\n' | sort | head -500
                fi
              done
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: sfs
              mountPath: /mnt/sfs
              readOnly: true
      volumes:
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
