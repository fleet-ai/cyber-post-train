apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-sft-corpus-stage-a62dd51f
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: sft-corpus-stage-a62dd51f
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: sft-corpus-stage-a62dd51f
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      nodeSelector:
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      containers:
        - name: stage
          image: ghcr.io/fleet-ai/miles-fleet/trainer@sha256:98920a4e25fadc3f31fafc18eff072313386edf5b352a23d13f4bb2d9e5f0a4c
          command: ["python", "-c"]
          args:
            - |
              import hashlib
              import json
              import os
              import shutil
              import tarfile
              import time
              from pathlib import Path

              archive = Path("/upload/stage.tar.gz")
              ready = Path("/upload/READY")
              deadline = time.monotonic() + 3300
              while not ready.is_file():
                  if time.monotonic() > deadline:
                      raise TimeoutError("stage archive was not uploaded before the deadline")
                  time.sleep(2)
              if not archive.is_file():
                  raise FileNotFoundError(archive)

              extracted = Path("/tmp/stage")
              with tarfile.open(archive, "r:gz") as bundle:
                  for member in bundle.getmembers():
                      target = (extracted / member.name).resolve()
                      if extracted.resolve() not in target.parents and target != extracted.resolve():
                          raise ValueError(f"unsafe archive member: {member.name}")
                  bundle.extractall(extracted, filter="data")

              manifest_path = extracted / "stage-manifest.json"
              manifest = json.loads(manifest_path.read_text())
              assert manifest["schema"] == "fleet_sft_corpus_stage_v1"
              assert manifest["eligible_sessions"] == 587
              assert manifest["team_id"] == "a1025f0b-ad67-49fc-a023-51800ab43e84"

              files = [*manifest["corpus"], manifest["scores"]]
              for item in files:
                  source = extracted / item["relative_path"]
                  expected = item["sha256"].removeprefix("sha256:")
                  actual = hashlib.file_digest(source.open("rb"), "sha256").hexdigest()
                  assert actual == expected, item["relative_path"]
                  target = Path("/mnt/sfs") / item["relative_path"]
                  target.parent.mkdir(parents=True, exist_ok=True)
                  if target.exists():
                      found = hashlib.file_digest(target.open("rb"), "sha256").hexdigest()
                      assert found == expected, f"refusing to overwrite {target}"
                  else:
                      temporary = target.with_suffix(target.suffix + ".partial")
                      shutil.copyfile(source, temporary)
                      os.chmod(temporary, 0o600)
                      os.replace(temporary, target)
                  print("STAGED_VERIFIED", target, expected, flush=True)

              receipt = Path(
                  "/mnt/sfs/cyber-post-train/manifests/"
                  "chris-cyber-sft-corpus-stage-a62dd51f.json"
              )
              receipt.parent.mkdir(parents=True, exist_ok=True)
              temporary = receipt.with_suffix(".json.partial")
              shutil.copyfile(manifest_path, temporary)
              os.chmod(temporary, 0o600)
              os.replace(temporary, receipt)
              print("CORPUS_STAGE_COMPLETE", receipt, flush=True)
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: upload
              mountPath: /upload
            - name: sfs
              mountPath: /mnt/sfs
      volumes:
        - name: upload
          emptyDir: {}
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
