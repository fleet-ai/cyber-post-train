spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: training-lq
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: preflight-b4734de4
      annotations:
        kueue.x-k8s.io/podset-required-topology: kubernetes.io/hostname
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: fleetai-training-ng-gpu
      tolerations:
      - key: workload
        operator: Equal
        value: fleetai-training-ng-gpu
        effect: NoSchedule
      containers:
      - name: preflight
        image: ghcr.io/fleet-ai/cyber-post-train-nemo-rl-glm52@sha256:aec56926a7f0db357c3ac1eaf1576f4113ec7ac1adfbacb29cbfe4d3a7955666
        imagePullPolicy: IfNotPresent
        command:
        - /bin/bash
        - -ceu
        - --
        args:
        - "install -d -m 0755 /mnt/sfs/cyber-post-train/compatibility/b4734de4\nprintf\
          \ '%s' \"$PROBE_ARCHIVE_B64\" | base64 -d > /tmp/cyber-post-train-probe.zip\n\
          printf '%s  %s\n' \"$PROBE_ARCHIVE_SHA256\" /tmp/cyber-post-train-probe.zip\
          \ | sha256sum -c -\nexport PYTHONPATH=/tmp/cyber-post-train-probe.zip\n\
          uv run --frozen --extra mcore --extra vllm python -m training.compatibility_probe\
          \ static \\\n  --model-root /mnt/sfs/models/zai-org/GLM-5.2/b4734de4facf877f85769a911abafc5283eab3d9\
          \ \\\n  --output /mnt/sfs/cyber-post-train/compatibility/b4734de4/environment.json\n\
          uv run --frozen --extra mcore --extra vllm torchrun \\\n  --standalone --nproc-per-node=8\
          \ -m training.compatibility_probe collective \\\n  --output /mnt/sfs/cyber-post-train/compatibility/b4734de4/nccl.json\n\
          echo PREFLIGHT_COMPLETE /mnt/sfs/cyber-post-train/compatibility/b4734de4"
        env:
        - name: PROBE_ARCHIVE_B64
          value: 
        - name: PROBE_ARCHIVE_SHA256
          value: 19af0d6248a8258e66e4061c3b14a9271e9014d8e36bfb975f6dea50e1257b1f
        - name: TRAINING_IMAGE_DIGEST
          value: sha256:aec56926a7f0db357c3ac1eaf1576f4113ec7ac1adfbacb29cbfe4d3a7955666
        - name: NEMO_RL_COMMIT
          value: 63e620046c67f922c4a57dcb65d7e6fceb60f5d4
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        resources:
          requests:
            cpu: '16'
            memory: 128Gi
            nvidia.com/gpu: '8'
          limits:
            cpu: '32'
            memory: 256Gi
            nvidia.com/gpu: '8'
        volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
      volumes:
      - name: sfs
        persistentVolumeClaim:
          claimName: sfs-shared
