apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-glm52-model-probe-b4734de4
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: model-probe-b4734de4
  annotations:
    cyber-post-train.fleet.ai/training-image-digest: sha256:aec56926a7f0db357c3ac1eaf1576f4113ec7ac1adfbacb29cbfe4d3a7955666
    cyber-post-train.fleet.ai/model-revision: b4734de4facf877f85769a911abafc5283eab3d9
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: training-lq
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: model-probe-b4734de4
    spec:
      restartPolicy: Never
      nodeSelector:
        workload: fleetai-training-ng-gpu
      tolerations:
      - key: workload
        operator: Equal
        value: fleetai-training-ng-gpu
        effect: NoSchedule
      containers:
      - name: model-probe
        image: ghcr.io/fleet-ai/cyber-post-train-nemo-rl-glm52@sha256:aec56926a7f0db357c3ac1eaf1576f4113ec7ac1adfbacb29cbfe4d3a7955666
        imagePullPolicy: IfNotPresent
        workingDir: /opt/nemo-rl
        command:
        - /bin/bash
        - -ceu
        - --
        args:
        - 'test -s /mnt/sfs/cyber-post-train/compatibility/b4734de4/environment.json

          test -s /mnt/sfs/cyber-post-train/compatibility/b4734de4/nccl.json

          install -d -m 0755 /mnt/sfs/cyber-post-train/compatibility/b4734de4/model-probe

          printf ''%s'' "$MODEL_PROBE_CONFIG_B64" | base64 -d > /tmp/glm52-model-probe.yaml

          printf ''%s'' "$MODEL_PROBE_DATA_B64" | base64 -d > /tmp/glm52-model-probe.jsonl

          printf ''%s  %s

          '' "$MODEL_PROBE_CONFIG_SHA256" /tmp/glm52-model-probe.yaml | sha256sum
          -c -

          uv run --frozen --extra mcore python examples/run_sft.py --config /tmp/glm52-model-probe.yaml

          test -d /mnt/sfs/cyber-post-train/compatibility/b4734de4/model-probe/checkpoints

          uv run --frozen --extra mcore python examples/run_sft.py   --config /tmp/glm52-model-probe.yaml   sft.max_num_epochs=2
          sft.max_num_steps=2

          jq -n   --arg image "$TRAINING_IMAGE_DIGEST"   --arg revision "$MODEL_REVISION"   --arg
          config "sha256:$MODEL_PROBE_CONFIG_SHA256"   ''{schema:"glm52_model_probe_v1",status:"succeeded",image_digest:$image,model_revision:$revision,config_sha256:$config,checks:{hf_to_megatron:true,expert_parallel_8:true,lora_attached:true,bf16_forward_backward:true,optimizer_step:true,checkpoint_saved:true,checkpoint_resumed:true}}''   >
          /mnt/sfs/cyber-post-train/compatibility/b4734de4/model-probe/receipt.json

          echo MODEL_PROBE_COMPLETE /mnt/sfs/cyber-post-train/compatibility/b4734de4/model-probe/receipt.json'
        env:
        - name: MODEL_PROBE_CONFIG_B64
          value: 
        - name: MODEL_PROBE_DATA_B64
          value: eyJpbnB1dCI6ICJSZXBseSB3aXRoIGV4YWN0bHk6IGNvbXBhdGliaWxpdHktcmVhZHkiLCAib3V0cHV0IjogImNvbXBhdGliaWxpdHktcmVhZHkifQo=
        - name: MODEL_PROBE_CONFIG_SHA256
          value: 7920f4c7513cb13eaa2f5c7410e81e6a7c1c26b5edb883a4192ebdc4dfd09da7
        - name: TRAINING_IMAGE_DIGEST
          value: sha256:aec56926a7f0db357c3ac1eaf1576f4113ec7ac1adfbacb29cbfe4d3a7955666
        - name: NEMO_RL_COMMIT
          value: 63e620046c67f922c4a57dcb65d7e6fceb60f5d4
        - name: MODEL_REVISION
          value: b4734de4facf877f85769a911abafc5283eab3d9
        - name: NRL_MEGATRON_CHECKPOINT_DIR
          value: /mnt/sfs/cyber-post-train/megatron-cache/b4734de4
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: TRANSFORMERS_OFFLINE
          value: '1'
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:False
        resources:
          requests:
            cpu: '96'
            memory: 1200Gi
            nvidia.com/gpu: '8'
          limits:
            cpu: '192'
            memory: 2Ti
            nvidia.com/gpu: '8'
        volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
      volumes:
      - name: sfs
        persistentVolumeClaim:
          claimName: sfs-shared
