apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-sft-corpus-readability-a62dd51f
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: sft-corpus-readability-a62dd51f
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: sft-corpus-readability-a62dd51f
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      nodeSelector:
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      containers:
        - name: verify-readability
          image: ghcr.io/fleet-ai/miles-fleet/trainer@sha256:98920a4e25fadc3f31fafc18eff072313386edf5b352a23d13f4bb2d9e5f0a4c
          command: ["python", "-c"]
          args:
            - |
              import hashlib
              import json
              import os
              from pathlib import Path

              receipt = Path(
                  "/mnt/sfs/cyber-post-train/manifests/"
                  "chris-cyber-sft-corpus-stage-a62dd51f.json"
              )
              manifest = json.loads(receipt.read_text())
              assert manifest["schema"] == "fleet_sft_corpus_stage_v1"
              assert manifest["eligible_sessions"] == 587
              for item in [*manifest["corpus"], manifest["scores"]]:
                  path = Path("/mnt/sfs") / item["relative_path"]
                  expected = item["sha256"].removeprefix("sha256:")
                  actual = hashlib.file_digest(path.open("rb"), "sha256").hexdigest()
                  assert actual == expected, path
                  os.chmod(path, 0o644)
                  assert path.stat().st_mode & 0o777 == 0o644
                  print("READABLE_HASH_VERIFIED", path, expected, flush=True)
              print("CORPUS_READABILITY_COMPLETE", len(manifest["corpus"]) + 1)
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: sfs
              mountPath: /mnt/sfs
      volumes:
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
