apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-glm52-stage-data-05c79281
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: stage-data-05c79281
  annotations:
    cyber-post-train.fleet.ai/dataset-manifest-digest: sha256:05c7928155f7d3d0c9d387164e559985c2498d0c40b32a2a0884f6c629fb0494
    cyber-post-train.fleet.ai/archive-sha256: 1759f9c76137c4bb1d7e87ba63d1a00ff707e6694b1eb2c3ffc5c540e4b97de3
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 7200
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: stage-data-05c79281
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      nodeSelector:
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      containers:
        - name: stage-data
          image: ghcr.io/fleet-ai/miles-fleet/trainer@sha256:98920a4e25fadc3f31fafc18eff072313386edf5b352a23d13f4bb2d9e5f0a4c
          imagePullPolicy: IfNotPresent
          command: [/bin/bash, -ceu, --]
          args:
            - |
              incoming=/mnt/sfs/cyber-post-train/data/.incoming
              archive=$incoming/glm52-fleet-v2-05c79281.tar.gz
              final=/mnt/sfs/cyber-post-train/data/05c7928155f7d3d0c9d387164e559985c2498d0c40b32a2a0884f6c629fb0494
              partial=$final.partial
              install -d -m 0700 "$incoming"
              for attempt in $(seq 1 360); do
                test -s "$archive" && break
                test "$attempt" -lt 360
                sleep 10
              done
              printf '%s  %s\n' '1759f9c76137c4bb1d7e87ba63d1a00ff707e6694b1eb2c3ffc5c540e4b97de3' "$archive" | sha256sum -c -
              test ! -e "$final"
              install -d -m 0700 "$partial"
              tar -xzf "$archive" -C "$partial"
              python - "$partial" <<'PY'
              import hashlib
              import json
              import sys
              from pathlib import Path

              root = Path(sys.argv[1])
              manifest = json.loads((root / "manifest.json").read_text())
              expected_manifest = "sha256:05c7928155f7d3d0c9d387164e559985c2498d0c40b32a2a0884f6c629fb0494"
              if manifest.get("manifest_digest") != expected_manifest:
                  raise SystemExit("dataset manifest digest mismatch")
              selected = {"sft_train", "sft_dev", "sft_test", "preferences", "rl_prompts"}
              if selected != set(manifest["files"]) - {"trajectories"}:
                  raise SystemExit("unexpected trainer-input file set")
              for name in sorted(selected):
                  entry = manifest["files"][name]
                  path = root / entry["path"]
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  if "sha256:" + digest != entry["sha256"]:
                      raise SystemExit(f"digest mismatch: {name}")
                  rows = sum(1 for _ in path.open("rb"))
                  if rows != entry["rows"]:
                      raise SystemExit(f"row-count mismatch: {name}")
              print("TRAINER_INPUTS_VERIFIED", expected_manifest)
              PY
              chmod -R go-rwx "$partial"
              mv "$partial" "$final"
              echo DATASET_PROMOTED "$final"
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 4Gi
          volumeMounts:
            - name: sfs
              mountPath: /mnt/sfs
      volumes:
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
