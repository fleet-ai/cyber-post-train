apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-qwen38-stage-1d4bf0f2
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: qwen38-stage-1d4bf0f2
    cyber-post-train.fleet.ai/model: qwen38
spec:
  suspend: true
  backoffLimit: 3
  activeDeadlineSeconds: 86400
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        kueue.x-k8s.io/queue-name: training-lq
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: qwen38-stage-1d4bf0f2
        cyber-post-train.fleet.ai/model: qwen38
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
      - name: ghcr-pull
      nodeSelector:
        workload: fleetai-training-ng-cpu
      tolerations:
      - key: workload
        operator: Equal
        value: fleetai-training-ng-cpu
        effect: NoSchedule
      containers:
      - name: stage
        image: ghcr.io/fleet-ai/miles-fleet/trainer@sha256:98920a4e25fadc3f31fafc18eff072313386edf5b352a23d13f4bb2d9e5f0a4c
        env:
        - name: HF_HOME
          value: /mnt/sfs/hf-cache/chris-cyber-qwen38
        - name: HF_XET_HIGH_PERFORMANCE
          value: "1"
        - name: HF_XET_NUM_CONCURRENT_RANGE_GETS
          value: "32"
        command: ["/bin/bash", "-ceu", "--"]
        args:
        - |
          repo=Qwen/Qwen3.8-27B
          revision=1d4bf0f2ff6012fd82039f2fa52739d0dd7c60c0
          expected_manifest=06c94e47c0e31fd331ed410665c830ab1b657f90f15a1b11e7bc45e2de00f352
          parent=/mnt/sfs/models/Qwen/Qwen3.8-27B
          partial="$parent/.partial-$revision"
          final="$parent/$revision"
          mkdir -p "$parent"
          candidate="$partial"
          already_promoted=false
          if [[ -f "$final/.cyber-post-train-lock.json" ]]; then
            candidate="$final"
            already_promoted=true
          else
            test ! -e "$final"
            mkdir -p "$partial"
            python - "$revision" "$partial/source-tree.json" "$expected_manifest" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request
          revision, output, expected = sys.argv[1:]
          url = f"https://huggingface.co/api/models/Qwen/Qwen3.8-27B/tree/{revision}?recursive=true&limit=1000"
          with urllib.request.urlopen(url, timeout=60) as response:
              tree = json.load(response)
          shards = sorted(
              ({"path": item["path"], "size": item["size"], "sha256": item["lfs"]["oid"]}
               for item in tree
               if item["path"].startswith("model-") and item["path"].endswith("-of-00018.safetensors")),
              key=lambda item: item["path"],
          )
          assert len(shards) == 18
          encoded = json.dumps(shards, sort_keys=True, separators=(",", ":")).encode()
          assert hashlib.sha256(encoded).hexdigest() == expected
          with open(output, "w") as handle:
              json.dump({"revision": revision, "shards": shards}, handle, sort_keys=True)
          print("REMOTE_MANIFEST_VERIFIED", len(shards), expected)
          PY
            files=(
              LICENSE chat_template.jinja config.json generation_config.json merges.txt
              model.safetensors.index.json preprocessor_config.json tokenizer.json
              tokenizer_config.json video_preprocessor_config.json vocab.json
            )
            for index in {1..18}; do
              printf -v shard 'model-%05d-of-00018.safetensors' "$index"
              files+=("$shard")
            done
            hf download "$repo" "${files[@]}" --revision "$revision" --local-dir "$partial" --max-workers 32
          fi
          python - "$candidate" "$revision" "$expected_manifest" "$already_promoted" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          revision = sys.argv[2]
          expected_manifest = sys.argv[3]
          already_promoted = sys.argv[4] == "true"
          tree = json.loads((root / "source-tree.json").read_text())
          assert tree["revision"] == revision
          assert len(tree["shards"]) == 18
          for index, shard in enumerate(tree["shards"], 1):
              path = root / shard["path"]
              assert path.stat().st_size == shard["size"], shard["path"]
              with path.open("rb") as handle:
                  actual = hashlib.file_digest(handle, "sha256").hexdigest()
              assert actual == shard["sha256"], shard["path"]
              print("VERIFIED_SHARDS", index, flush=True)
          small_files = {
              "LICENSE": "bbedc3fda3305820b977265f01b8619d87570a6739de3a5582c3464840f1e57a",
              "chat_template.jinja": "c3cf9e34abf4f9e36c2d72165aa9c132d3e2a725b6c2586aaa3a8af9d7a81041",
              "config.json": "191e0af232104ed8b65258cf3fb2b842e288008baca7633c11b82a1ac7203aab",
              "generation_config.json": "e70c136c1b78ddc1fb0905bac8e733a4dc448d4f852a5dd75143fffc70be550e",
              "merges.txt": "a9d356d7bdf1ef4949e3e748e95b8e10ad9d4e2e838eddc38a0a7b6b94d1db8d",
              "model.safetensors.index.json": "77042094076611b69791a610065f28b7013b8c621795fa86ddccc8bac7d1b9df",
              "preprocessor_config.json": "27225450ac9c6529872ee1924fcb0962ff5634834f817040f444118116f4e516",
              "tokenizer.json": "0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3",
              "tokenizer_config.json": "b11349aafa7cdc6a320767cf7ceb29ed82f7eda5d65e8e0819e76f0ce947bf27",
              "video_preprocessor_config.json": "7768af27c1fafa9cc9011c1dc20067e03f8915e03b63504550e11d5066986d13",
              "vocab.json": "ce99b4cb2983d118806ce0a8b777a35b093e2000a503ebde25853284c9dfa003",
          }
          for name, expected in small_files.items():
              with (root / name).open("rb") as handle:
                  assert hashlib.file_digest(handle, "sha256").hexdigest() == expected, name
          expected_paths = set(small_files) | {item["path"] for item in tree["shards"]}
          expected_paths.add("source-tree.json")
          actual_paths = {
              str(path.relative_to(root))
              for path in root.rglob("*")
              if path.is_file()
              and ".cache" not in path.relative_to(root).parts
              and path.name not in {".cyber-post-train-lock.json", ".cyber-post-train-lock.json.tmp"}
          }
          assert actual_paths == expected_paths, (actual_paths - expected_paths, expected_paths - actual_paths)
          lock = {
              "schema": "cyber_post_train_checkpoint_lock_v1",
              "repo": "Qwen/Qwen3.8-27B",
              "revision": revision,
              "weights_manifest_sha256": "sha256:" + expected_manifest,
              "verified_shards": 18,
              "verified_bytes": sum(item["size"] for item in tree["shards"]),
              "small_file_sha256": small_files,
          }
          lock_path = root / ".cyber-post-train-lock.json"
          if already_promoted:
              assert json.loads(lock_path.read_text()) == lock
          else:
              temporary = root / ".cyber-post-train-lock.json.tmp"
              temporary.write_text(json.dumps(lock, indent=2, sort_keys=True) + "\n")
              os.replace(temporary, lock_path)
          print("LOCAL_CHECKPOINT_VERIFIED", revision)
          PY
          if [[ "$already_promoted" == true ]]; then
            echo "CHECKPOINT_ALREADY_VERIFIED $revision"
            exit 0
          fi
          mv "$partial" "$final"
          echo "CHECKPOINT_PROMOTED $final"
        resources:
          requests:
            cpu: "8"
            memory: 16Gi
            ephemeral-storage: 20Gi
          limits:
            cpu: "16"
            memory: 32Gi
            ephemeral-storage: 40Gi
        volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
      volumes:
      - name: sfs
        persistentVolumeClaim:
          claimName: sfs-shared
