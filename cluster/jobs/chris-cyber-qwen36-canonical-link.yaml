apiVersion: batch/v1
kind: Job
metadata:
  name: chris-cyber-qwen36-canonical-link
  namespace: fleet-train-jobs
  labels:
    kueue.x-k8s.io/queue-name: training-lq
    cyber-post-train.fleet.ai/owner: chris
    cyber-post-train.fleet.ai/experiment: canonical-link-6a9e13bd
    cyber-post-train.fleet.ai/model: qwen36
  annotations:
    cyber-post-train.fleet.ai/model-revision: 6a9e13bd6fc8f0983b9b99948120bc37f49c13e9
spec:
  suspend: true
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels:
        cyber-post-train.fleet.ai/owner: chris
        cyber-post-train.fleet.ai/experiment: canonical-link-6a9e13bd
        cyber-post-train.fleet.ai/model: qwen36
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      nodeSelector:
        workload: fleetai-training-ng-cpu
      tolerations:
        - key: workload
          operator: Equal
          value: fleetai-training-ng-cpu
          effect: NoSchedule
      containers:
        - name: link
          image: ghcr.io/fleet-ai/miles-fleet/trainer@sha256:98920a4e25fadc3f31fafc18eff072313386edf5b352a23d13f4bb2d9e5f0a4c
          command: ["python", "-c"]
          args:
            - |
              import json
              import os
              from pathlib import Path

              revision = "6a9e13bd6fc8f0983b9b99948120bc37f49c13e9"
              source = Path("/mnt/sfs/models/Qwen/Qwen3.6-27B") / revision
              target = Path("/mnt/sfs/models/qwen3.6-27b")
              lock = json.loads((source / ".cyber-post-train-lock.json").read_text())
              assert lock["repo"] == "Qwen/Qwen3.6-27B"
              assert lock["revision"] == revision
              assert lock["weights_manifest_sha256"] == "sha256:14ad10368de9b9e5974ff12a4b70ea7884194b58e670177bbac79daeb81f16b9"
              assert len(list(source.glob("*.safetensors"))) == 15
              if target.is_symlink():
                  assert target.resolve() == source.resolve()
              elif target.exists():
                  raise RuntimeError(f"refusing to replace existing canonical path: {target}")
              else:
                  os.symlink(source, target)
              assert (target / "config.json").is_file()
              assert len(list(target.glob("*.safetensors"))) == 15
              print("CANONICAL_MODEL_PATH_READY", target, "revision", revision)
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: sfs
              mountPath: /mnt/sfs
      volumes:
        - name: sfs
          persistentVolumeClaim:
            claimName: sfs-shared
