apiVersion: v1
kind: Pod
metadata:
  name: chris-q38-lr30-p76-audit-v3
  namespace: fleet-train-jobs
  annotations:
    fleet.ai/purpose: "read-only LR30 step-76 terminal receipt and checkpoint inventory"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  priorityClassName: c1
  activeDeadlineSeconds: 900
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
  nodeSelector:
    workload: fleetai-training-ng-cpu
  tolerations:
    - key: workload
      operator: Equal
      value: fleetai-training-ng-cpu
      effect: NoSchedule
  containers:
    - name: auditor
      image: 661864827319.dkr.ecr.us-east-1.amazonaws.com/fleet/skyrl-train@sha256:ba288751cd227c5be146d28f4a03237545d87d2cbd4c48464945b17fde566ff4
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -c
        - |
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("/mnt/sfs/jobs/chris-q38-lr30-resume76-prod-v1")
          if not root.is_dir():
              raise SystemExit("expected run root is absent")

          allowed = {
              "STARTED.json",
              "PROGRESS.json",
              "ACTIVITY.json",
              "TRAINING_COMPLETE.json",
              "TRAINING_TRACKING_INCOMPLETE.json",
              "TRAINING_REJECTED.json",
              "TRAINING_PAUSED.json",
              "FAILED.json",
              "REJECTED.json",
              "WANDB.json",
              "BEST_CHECKPOINT.json",
              "DEVICE_INITIALIZED.json",
          }
          selected = {}
          for name in sorted(allowed):
              path = root / name
              if not path.is_file() or path.is_symlink():
                  continue
              raw = path.read_bytes()
              value = json.loads(raw)
              selected[name] = {
                  key: value[key]
                  for key in (
                      "schema",
                      "status",
                      "phase",
                      "optimizer_step",
                      "receipt_sha256",
                      "run_id",
                      "project",
                      "entity",
                      "url",
                  )
                  if key in value
              }
              selected[name]["file_sha256"] = hashlib.sha256(raw).hexdigest()

          checkpoints = root / "checkpoints"
          checkpoint_dirs = []
          if checkpoints.is_dir():
              for path in sorted(checkpoints.glob("global_step_*")):
                  if path.is_dir() and not path.is_symlink():
                      checkpoint_dirs.append(
                          {
                              "name": path.name,
                              "files": sum(1 for item in path.rglob("*") if item.is_file()),
                          }
                      )

          receipts = root / "checkpoint_receipts"
          checkpoint_receipts = []
          if receipts.is_dir():
              for path in sorted(receipts.glob("step-*.json")):
                  if path.is_file() and not path.is_symlink():
                      value = json.loads(path.read_text())
                      checkpoint_receipts.append(
                          {
                              "name": path.name,
                              "optimizer_step": value.get("optimizer_step"),
                              "receipt_sha256": value.get("receipt_sha256"),
                              "file_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                          }
                      )

          seal_output = root / "checkpoint-seals-v1/step-76.json"
          sealer_wheel = root / "checkpoint-sealer-code-v1/cyber_post_train-0.1.0-py3-none-any.whl"
          sealer_wheel_sha256 = (
              hashlib.sha256(sealer_wheel.read_bytes()).hexdigest()
              if sealer_wheel.is_file() and not sealer_wheel.is_symlink()
              else None
          )
          if seal_output.exists() or sealer_wheel_sha256 != "5d10b58abd8ce8489c826cff7ef763a28309b8705aa08ee8df4ef26326fd8525":
              raise SystemExit("sealer destination is not fresh or staged wheel identity differs")

          proof = {
              "schema": "cyber_qwen38_lr30_prod76_receipt_audit_v3",
              "pod_uid": os.environ["POD_UID"],
              "run_root": str(root),
              "selected_receipts": selected,
              "checkpoint_directories": checkpoint_dirs,
              "checkpoint_receipts": checkpoint_receipts,
              "seal_destination_absent": True,
              "sealer_wheel_sha256": sealer_wheel_sha256,
              "read_only_sfs": True,
              "gpu_count": 0,
              "private_logs_read": False,
              "tensor_values_read": False,
          }
          canonical = json.dumps(proof, sort_keys=True, separators=(",", ":")).encode()
          proof["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()
          print(json.dumps(proof, sort_keys=True, separators=(",", ":")), flush=True)
      env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "2"
          memory: 4Gi
      volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
          readOnly: true
  volumes:
    - name: sfs
      persistentVolumeClaim:
        claimName: sfs-shared
        readOnly: true
