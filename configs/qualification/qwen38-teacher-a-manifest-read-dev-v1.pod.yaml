apiVersion: v1
kind: Pod
metadata:
  name: chris-q38-teacher-a-manifest-read-v1
  namespace: fleet-train-jobs
  annotations:
    fleet.ai/purpose: "read one immutable corpus manifest needed for offline plan compilation"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  priorityClassName: c1
  activeDeadlineSeconds: 300
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
  containers:
    - name: reader
      image: 661864827319.dkr.ecr.us-east-1.amazonaws.com/fleet/skyrl-train@sha256:ba288751cd227c5be146d28f4a03237545d87d2cbd4c48464945b17fde566ff4
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -c
        - |
          import hashlib
          import json
          from pathlib import Path

          path = Path("/mnt/sfs/jobs/chris-q38-study-corpora-v1/teacher-a/manifest-available-a-outcome-v2.json")
          raw = path.read_bytes()
          value = json.loads(raw)
          if value.get("sha256") != "sha256:1b083613c16362daf7c86fd8b458d99d7e167133df919602c21916314142c4dc":
              raise ValueError("corpus manifest identity mismatch")
          print(json.dumps({"file_sha256": hashlib.sha256(raw).hexdigest(), "manifest": value}, sort_keys=True, separators=(",", ":")), flush=True)
      resources:
        requests:
          cpu: "100m"
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
          readOnly: true
  nodeSelector:
    workload: fleetai-training-ng-cpu
  tolerations:
    - key: workload
      operator: Equal
      value: fleetai-training-ng-cpu
      effect: NoSchedule
  volumes:
    - name: sfs
      persistentVolumeClaim:
        claimName: sfs-shared
        readOnly: true
