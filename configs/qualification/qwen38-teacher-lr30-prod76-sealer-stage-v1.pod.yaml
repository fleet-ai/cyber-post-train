apiVersion: v1
kind: Pod
metadata:
  name: chris-q38-lr30-p76-stage-v1
  namespace: fleet-train-jobs
  annotations:
    fleet.ai/purpose: "stage an exact CPU checkpoint-sealer wheel into the owned LR30 run tree"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  priorityClassName: c1
  activeDeadlineSeconds: 900
  terminationGracePeriodSeconds: 10
  securityContext:
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
  nodeSelector:
    workload: fleetai-training-ng-cpu
  tolerations:
    - key: workload
      operator: Equal
      value: fleetai-training-ng-cpu
      effect: NoSchedule
  containers:
    - name: stage
      image: 661864827319.dkr.ecr.us-east-1.amazonaws.com/fleet/skyrl-train@sha256:ba288751cd227c5be146d28f4a03237545d87d2cbd4c48464945b17fde566ff4
      imagePullPolicy: IfNotPresent
      command: ["sleep", "600"]
      resources:
        requests:
          cpu: "250m"
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
  volumes:
    - name: sfs
      persistentVolumeClaim:
        claimName: sfs-shared
