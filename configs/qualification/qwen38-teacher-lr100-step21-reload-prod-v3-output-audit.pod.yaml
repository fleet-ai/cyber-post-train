apiVersion: v1
kind: Pod
metadata:
  name: chris-q38-lr100-r21-prod-v3-output-audit
  namespace: fleet-train-jobs
  annotations:
    fleet.ai/purpose: "read-only create-once output audit for the LR100 production reload"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  priorityClassName: c1
  activeDeadlineSeconds: 600
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
  containers:
    - name: auditor
      image: 661864827319.dkr.ecr.us-east-1.amazonaws.com/fleet/skyrl-train@sha256:ba288751cd227c5be146d28f4a03237545d87d2cbd4c48464945b17fde566ff4
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -c
        - |
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("/mnt/sfs/jobs/chris-q38-lr100-r21-prod-v3")
          files = (
              [path for path in root.rglob("*") if path.is_file() and not path.is_symlink()]
              if root.is_dir() and not root.is_symlink()
              else []
          )
          proof = {
              "schema": "cyber_qwen38_lr100_step21_reload_prod_v3_output_audit_v1",
              "pod_uid": os.environ["POD_UID"],
              "root_exists": root.is_dir() and not root.is_symlink(),
              "file_count": len(files),
              "total_bytes": sum(path.stat().st_size for path in files),
              "read_only_sfs": True,
              "gpu_count": 0,
              "private_logs_read": False,
              "tensor_values_read": False,
          }
          canonical = json.dumps(proof, sort_keys=True, separators=(",", ":")).encode()
          proof["receipt_sha256"] = hashlib.sha256(canonical).hexdigest()
          print(json.dumps(proof, sort_keys=True, separators=(",", ":")), flush=True)
      env:
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      resources:
        requests:
          cpu: "1"
          memory: 512Mi
        limits:
          cpu: "2"
          memory: 2Gi
      volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
          readOnly: true
  nodeSelector:
    workload: fleetai-training-ng-cpu
  tolerations:
    - key: workload
      operator: Equal
      value: fleetai-training-ng-cpu
      effect: NoSchedule
  volumes:
    - name: sfs
      persistentVolumeClaim:
        claimName: sfs-shared
        readOnly: true
