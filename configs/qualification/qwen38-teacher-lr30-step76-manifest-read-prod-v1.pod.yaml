apiVersion: v1
kind: Pod
metadata:
  name: chris-q38-lr30-step76-manifest-read-v1
  namespace: fleet-train-jobs
  annotations:
    fleet.ai/purpose: "read the immutable LR30 step-76 checkpoint manifest for offline reload planning"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  priorityClassName: c1
  activeDeadlineSeconds: 300
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 100
    fsGroup: 100
  containers:
    - name: reader
      image: 661864827319.dkr.ecr.us-east-1.amazonaws.com/fleet/skyrl-train@sha256:ba288751cd227c5be146d28f4a03237545d87d2cbd4c48464945b17fde566ff4
      imagePullPolicy: IfNotPresent
      command:
        - python3
        - -c
        - |
          import json
          from pathlib import Path

          path = Path("/mnt/sfs/jobs/chris-q38-lr30-resume76-prod-v1/checkpoint-seals-v1/step-76.json")
          value = json.loads(path.read_text())
          if value.get("receipt_sha256") != "1252a1a9d5556fa118f03d1b2fe5687e0e9505ccf622e2f86743a26b77dffa64":
              raise ValueError("LR30 checkpoint receipt digest mismatch")
          print(json.dumps(value, indent=2, sort_keys=True), flush=True)
      resources:
        requests:
          cpu: "100m"
          memory: 128Mi
        limits:
          cpu: "1"
          memory: 1Gi
      volumeMounts:
        - name: sfs
          mountPath: /mnt/sfs
          readOnly: true
  nodeSelector:
    workload: fleetai-training-ng-cpu
  tolerations:
    - key: workload
      operator: Equal
      value: fleetai-training-ng-cpu
      effect: NoSchedule
  volumes:
    - name: sfs
      persistentVolumeClaim:
        claimName: sfs-shared
        readOnly: true
