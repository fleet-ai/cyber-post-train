[project]
name = "cyber-post-train"
version = "0.1.0"
description = "Reproducible evaluation and post-training for execution-grounded cyber agents"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
cyber-post-train = "cyber_post_train.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cyber_post_train", "training", "evals"]

[project.optional-dependencies]
dev = [
  "mcp==2.1.1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]
train = [
  "accelerate>=1.9,<2",
  "peft>=0.17,<1",
  "pyarrow>=20,<26",
  "safetensors>=0.6,<1",
  "transformers>=4.55,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals", "training"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
# Historical execution plans pin these source bytes. Keep their replay checks
# intact; a functional revision needs a new plan, not a rewritten old digest.
exclude = [
  "evals/webexploitbench/post_sft_evidence.py",
  "training/post_sft_artifacts.py",
  "training/post_sft_base_surface.py",
  "training/post_sft_cast.py",
  "training/post_sft_staging.py",
  "training/register_post_sft.py",
  "training/tokenizer_equivalence.py",
]
