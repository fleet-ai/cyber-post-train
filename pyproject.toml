[project]
name = "cyber-post-train"
version = "0.1.0"
description = "Reproducible evaluation and post-training for execution-grounded cyber agents"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
train = [
  "accelerate>=1.9,<2",
  "datasets>=4,<5",
  "peft>=0.17,<1",
  "safetensors>=0.6,<1",
  "transformers>=4.55,<6",
  "trl>=0.21,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "evals", "training"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
